<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/Konstrukt_logo-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KONSTRUKT - Plateforme de gestion de chantiers, météo, ressources et planification pour les professionnels du BTP." />
    <title>KONSTRUK</title>
    <script>
      // Applique le thème et le mode daltonien avant le premier affichage (évite un flash blanc).
      // Même clé et même logique que src/Context/DisplayPreferencesContext.tsx
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('konstrukt-display') || '{}');
          var dark = prefs.theme === 'dark' ||
            (prefs.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-colorblind', prefs.colorblind ? 'on' : 'off');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
